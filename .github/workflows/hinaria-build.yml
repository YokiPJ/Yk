name: HINARIA - verificar e compilar
on:
  push:
    branches: [main]
    paths: ['hinaria/**', 'package.json', '.github/workflows/hinaria-build.yml']
  pull_request:
    paths: ['hinaria/**', 'package.json', '.github/workflows/hinaria-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hinaria/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run setup
      - run: npm run build:animations
      - run: npm run build
      - run: npm run verify
      - run: npm --prefix hinaria run test:animations
      - uses: actions/upload-artifact@v4
        with:
          name: HINARIA-web-java
          path: |
            hinaria/www/
            hinaria/tools/motion-java/output/
            hinaria/downloads/HinariaMotion.jar
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hinaria/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run setup
      - run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: HINARIA-Android-1.2.1-debug
          path: hinaria/downloads/HINARIA_MODELOS_CORRIGIDOS_1.2.1_DEBUG.apk
