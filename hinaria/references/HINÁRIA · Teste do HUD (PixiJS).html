<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HINÁRIA · Teste do HUD (PixiJS)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 60% 40%,#2a2a33,#050507 75%);color:#ece9e2;font:13px system-ui,sans-serif}
#hud{position:absolute;left:8px;top:8px;width:min(207px,48vw);box-sizing:border-box;z-index:7;padding:9px 10px 8px}
#hud .row,#hud .bar{display:block}
#ui-hud-menu-btn{position:absolute;right:7px;top:6px;width:37px;height:32px;font:700 18px system-ui;cursor:pointer;border:1px solid;border-radius:10px}
#quest-quick-toggle{display:block;width:100%;margin-top:5px;padding:5px;border:1px solid;border-radius:6px;font:700 11px system-ui;text-align:left;cursor:pointer}
#hot{position:absolute;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,56px);gap:6px;z-index:8}
#hot button{width:56px;height:56px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px}
#hot .skill-label{font-size:9px;line-height:1.1}#hot .skill-key{font-size:9px}
#panel{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(92vw,560px)}
#panel button{font:600 12px system-ui;color:#ece9e2;background:#15151a;border:1px solid #6f6d68;border-radius:8px;padding:8px 10px;cursor:pointer}
#msg{position:absolute;left:50%;top:40%;transform:translateX(-50%);color:#9a978f;text-align:center;max-width:80vw}
/* HINÁRIA · HUD V2 (PixiJS): placa escura prata/preto; o Pixi desenha retrato e barras por cima do #hud. */
#hud-pixi{position:fixed;inset:0;width:100%;height:100%;z-index:11;pointer-events:none;touch-action:none}
#hud-danger{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 30px rgba(179,38,45,.75)}

body.hud-pixi.ui-v1 #hud{padding-top:88px;background:rgba(6,6,9,.8);border:1px solid rgba(201,204,209,.5);border-radius:14px;
  box-shadow:0 6px 22px #000a,inset 0 0 0 3px rgba(0,0,0,.6),inset 0 0 0 4px rgba(201,204,209,.16);backdrop-filter:blur(4px)}
/* Linhas/barras originais continuam no DOM (o jogo atualiza), só ficam ocultas: o Pixi mostra os valores. */
body.hud-pixi.ui-v1 #hud>.row,body.hud-pixi.ui-v1 #hud>.bar{display:none!important}
body.hud-pixi.ui-v1 #ui-hud-menu-btn{background:#0d0d11;border-color:rgba(201,204,209,.7);color:#ece9e2;border-radius:10px}
body.hud-pixi.ui-v1 #hud #quest-quick-toggle{background:rgba(255,255,255,.04);border-color:rgba(201,204,209,.35);color:#d8d5cd;
  font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.04em}
body.hud-pixi.ui-v1 #hud #qt{color:#d8d5cd}

/* Botões de habilidade no mesmo tema */
body.hud-pixi.ui-v1 #hot button{background:rgba(7,7,10,.84)!important;border:1px solid rgba(201,204,209,.55)!important;color:#ece9e2!important;
  font-family:Cinzel,Georgia,serif;box-shadow:inset 0 0 0 2px rgba(0,0,0,.55)}
body.hud-pixi.ui-v1 #hot button .skill-key{color:#c9ccd1}
body.hud-pixi.ui-v1 #hot button .skill-cd{color:#fff;text-shadow:0 1px 3px #000}

</style></head>

/** Retrato redondo pré-renderizado em canvas 2D (evita máscaras do Pixi). */
function circularPortrait(url, size) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      g.beginPath(); g.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); g.clip();
      const s = Math.max(size / img.width, size / img.height);
      const w = img.width * s, h = img.height * s;
      g.drawImage(img, (size - w) / 2, (size - h) * 0.1, w, h); // ancora perto do topo (rosto)
      resolve(c);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

/** Setor da recarga recortado no quadrado do botão (sem máscara). frac = parte que ainda falta. */
function sectorPoly(cx, cy, half, frac) {
  const pts = [cx, cy];
  const steps = Math.max(2, Math.ceil(frac * 90));
  for (let i = 0; i <= steps; i++) {
    const a = -Math.PI / 2 + (i / steps) * frac * Math.PI * 2;   // começa em cima, sentido horário
    const ca = Math.cos(a), sa = Math.sin(a);
    const t = half / Math.max(Math.abs(ca), Math.abs(sa));
    pts.push(cx + ca * t, cy + sa * t);
  }
  return pts;
}

async function initHudPixiV2() {
  const hudEl = document.getElementById('hud');
  if (!hudEl || document.getElementById('hud-pixi') || !document.body.classList.contains('ui-v1')) return null;

  let PIXI;
  try { PIXI = window.__pixi; } catch (e) { console.warn('[Hinária] Pixi indisponível, HUD clássico mantido.', e); return null; }
  const { Application, Graphics, Text, Texture, Sprite } = PIXI;

  const app = new Application();
  try {
    await app.init({ backgroundAlpha: 0, antialias: true, autoDensity: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2), resizeTo: window, preference: 'webgl' });
  } catch (e) { console.warn('[Hinária] Pixi não iniciou, HUD clássico mantido.', e); return null; }

  const canvas = app.canvas;
  canvas.id = 'hud-pixi';
  canvas.setAttribute('aria-hidden', 'true');
  document.body.append(canvas);
  const danger = document.createElement('div');
  danger.id = 'hud-danger'; danger.setAttribute('aria-hidden', 'true');
  document.body.append(danger);
  try { await document.fonts?.ready; } catch { /* segue com a fonte reserva */ }

  // ---------- Objetos ----------
  const dyn = new Graphics();                    // redesenhado todo quadro (barras, anéis, recarga, partículas)
  app.stage.addChild(dyn);
  const style = (size, fill, extra = {}) => ({ fontFamily: FONT, fontSize: size, fill, fontWeight: '700',
    stroke: { color: C.black, width: 3 }, ...extra });
  const mk = (size, fill, ax = 0, ay = 0.5, extra) => {
    const t = new Text({ text: '', style: style(size, fill, extra) });
    t.anchor.set(ax, ay); app.stage.addChild(t); return t;
  };
  const tLv = mk(11, C.ash, 0, 0.5, { letterSpacing: 1 });
  const tGold = mk(11, C.bone, 0, 0.5);
  const tHp = mk(9, C.bone, 1, 0.5, { stroke: { color: C.black, width: 2 } });
  const tMp = mk(8, C.bone, 1, 0.5, { stroke: { color: C.black, width: 2 } });
  const shown = { lv: -1, gold: -1, hp: '', mp: '' };
  let portrait = null;
  circularPortrait(PORTRAIT, 128).then(cv => {
    if (!cv) return;
    portrait = new Sprite(Texture.from(cv)); portrait.anchor.set(0.5);
    app.stage.addChildAt(portrait, 0);
  });

  // ---------- Estado de animação ----------
  const S = { hp: 1, ghost: 1, mp: 1, xp: 0, lastHp: null, lastLv: null, flashHit: 0, flashHeal: 0, flashLv: 0,
              prevCd: [0, 0, 0, 0], ready: [0, 0, 0, 0], t: 0, rectT: 99, plate: null, rects: [], visible: true };
  const parts = [];

  function refreshLayout() {
    const r = hudEl.getBoundingClientRect(), cs = getComputedStyle(hudEl);
    S.visible = r.width > 0 && cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0.05 && cs.display !== 'none';
    S.plate = S.visible ? { x: r.left, y: r.top, w: r.width } : null;
    S.rects = [];
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById(SKILL_IDS(i));
      const b = el ? el.getBoundingClientRect() : null;
      const ok = b && b.width > 4 && getComputedStyle(el).display !== 'none';
      S.rects[i] = ok ? { x: b.left, y: b.top, w: b.width, h: b.height, locked: el.classList.contains('skill-locked') } : null;
    }
  }
  window.addEventListener('resize', () => { S.rectT = 99; }, { passive: true });

  function bar(x, y, w, h, fill, ghost, color, hi, flash) {
    const r = h / 2;
    dyn.roundRect(x, y, w, h, r).fill({ color: C.black, alpha: 0.7 });
    if (ghost > fill + 0.002) dyn.roundRect(x, y, Math.max(h, w * ghost), h, r).fill({ color: 0xffffff, alpha: 0.5 });
    if (fill > 0.001) {
      const fw = Math.max(h, w * fill);
      dyn.roundRect(x, y, fw, h, r).fill({ color });
      dyn.roundRect(x + 2, y + 1, Math.max(0, fw - 4), Math.max(1, h * 0.36), r / 2).fill({ color: hi, alpha: 0.5 });
      if (flash > 0.01) dyn.roundRect(x, y, fw, h, r).fill({ color: 0xffffff, alpha: flash * 0.6 });
    }
    dyn.roundRect(x, y, w, h, r).stroke({ width: 1, color: C.silver, alpha: 0.35 });
  }

  function burst(x, y) {
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 110;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0.9 + Math.random() * 0.4, t: 0,
                   c: Math.random() < 0.6 ? C.gold : C.bone, r: 1.5 + Math.random() * 2 });
    }
  }

  // ---------- Quadro ----------
  app.ticker.maxFPS = 60;
  app.ticker.add(tk => {
    const dt = Math.min(0.1, tk.deltaMS / 1000);
    const P = gameState.P;
    S.t += dt; S.rectT += dt;
    if (S.rectT > 0.25) { S.rectT = 0; refreshLayout(); }
    dyn.clear();
    const show = !!P && S.visible && !document.hidden;
    app.stage.visible = show;
    if (!P) { danger.style.opacity = '0'; return; }

    // Valores-alvo
    const hpT = clamp01(P.hp / P.max), mpT = clamp01(P.mana / P.mm), xpT = clamp01(P.xp / (P.lv * 50));
    if (S.lastHp === null) { S.hp = S.ghost = hpT; S.mp = mpT; S.xp = xpT; S.lastHp = P.hp; S.lastLv = P.lv; }
    if (P.hp < S.lastHp) S.flashHit = 1; else if (P.hp > S.lastHp) S.flashHeal = 1;
    S.lastHp = P.hp;
    if (P.lv > S.lastLv && S.plate) { S.flashLv = 1; burst(S.plate.x + 38, S.plate.y + 52); }
    S.lastLv = P.lv;

    const k = 1 - Math.exp(-dt * 14), kg = 1 - Math.exp(-dt * 2.2);
    S.hp += (hpT - S.hp) * k; S.mp += (mpT - S.mp) * k; S.xp += (xpT - S.xp) * k;
    S.ghost = S.ghost > S.hp ? S.ghost + (S.hp - S.ghost) * kg * (S.flashHit > 0.5 ? 0 : 1) : S.hp;
    S.flashHit = Math.max(0, S.flashHit - dt * 3); S.flashHeal = Math.max(0, S.flashHeal - dt * 2.5);
    S.flashLv = Math.max(0, S.flashLv - dt * 1.2);

    // Vinheta de perigo (DOM, 1 div)
    const low = hpT < 0.3 && P.hp > 0 ? (0.3 - hpT) / 0.3 : 0;
    danger.style.opacity = show ? String(Math.min(0.9, low * (0.55 + 0.45 * Math.sin(S.t * 5)) + S.flashHit * 0.35)) : '0';

    if (!show) return;
    const pl = S.plate;
    if (pl) {
      const x = pl.x, y = pl.y, w = pl.w;
      // Retrato + anel
      const cx = x + 38, cy = y + 52, pr = 27;
      if (portrait) { portrait.position.set(cx, cy); portrait.width = portrait.height = pr * 2; portrait.visible = true; }
      const pulse = low ? 0.5 + 0.5 * Math.sin(S.t * 6) : 0;
      dyn.circle(cx, cy, pr + 2).stroke({ width: 2.5, color: S.flashLv > 0.05 ? C.gold : (low ? C.bloodHi : C.silver), alpha: 0.9 });
      if (S.flashHit > 0.02) dyn.circle(cx, cy, pr + 4).stroke({ width: 3, color: C.bloodHi, alpha: S.flashHit });
      if (S.flashHeal > 0.02) dyn.circle(cx, cy, pr + 4).stroke({ width: 3, color: 0xb9f0c4, alpha: S.flashHeal * 0.8 });
      if (S.flashLv > 0.02) dyn.circle(cx, cy, pr + 4 + (1 - S.flashLv) * 16).stroke({ width: 2, color: C.gold, alpha: S.flashLv });
      if (pulse) dyn.circle(cx, cy, pr).fill({ color: C.blood, alpha: 0.18 * pulse });

      // Textos (só reescreve quando muda)
      if (shown.lv !== P.lv) { tLv.text = 'NV ' + P.lv; shown.lv = P.lv; }
      if (shown.gold !== P.gold) { tGold.text = String(P.gold); shown.gold = P.gold; }
      const hpS = Math.max(0, Math.ceil(P.hp)) + '/' + P.max, mpS = Math.floor(P.mana) + '/' + P.mm;
      if (shown.hp !== hpS) { tHp.text = hpS; shown.hp = hpS; }
      if (shown.mp !== mpS) { tMp.text = mpS; shown.mp = mpS; }

      const x0 = x + 70, bw = w - 70 - 10;
      tLv.position.set(x0, y + 13);
      dyn.circle(x0 + 44, y + 13, 4.5).fill({ color: C.gold }).stroke({ width: 1, color: 0x7a5c0a });
      tGold.position.set(x0 + 53, y + 13);
      bar(x0, y + 38, bw, 14, S.hp, S.ghost, low ? C.bloodHi : C.blood, C.bloodHi, S.flashHeal * 0.4);
      bar(x0, y + 57, bw, 9, S.mp, S.mp, C.steel, C.steelHi, 0);
      bar(x0, y + 71, bw, 5, S.xp, S.xp, C.bone, 0xffffff, S.flashLv * 0.5);
      tHp.position.set(x0 + bw - 6, y + 45); tMp.position.set(x0 + bw - 5, y + 61.5);
    }

    // Recarga das habilidades
    const pw = POWERS[P.cls];
    if (pw) for (let i = 0; i < 4; i++) {
      const rc = S.rects[i], p = pw[i];
      if (!rc || !p) continue;
      const cdMax = p.cd || 1, cd = Math.max(0, P.cds?.[i] || 0), frac = clamp01(cd / cdMax);
      if (S.prevCd[i] > 0 && cd <= 0 && !rc.locked) S.ready[i] = 1;
      S.prevCd[i] = cd;
      const cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2, half = Math.min(rc.w, rc.h) / 2 - 1.5;
      if (rc.locked) dyn.roundRect(rc.x, rc.y, rc.w, rc.h, 10).fill({ color: C.black, alpha: 0.55 });
      else if (frac > 0) {
        dyn.poly(sectorPoly(cx, cy, half, frac)).fill({ color: C.black, alpha: 0.62 });
        const a = -Math.PI / 2 + frac * Math.PI * 2, t = half / Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a)));
        dyn.moveTo(cx, cy).lineTo(cx + Math.cos(a) * t, cy + Math.sin(a) * t).stroke({ width: 1.5, color: C.bone, alpha: 0.7 });
      } else if (P.mana < p.mp) dyn.roundRect(rc.x, rc.y, rc.w, rc.h, 10).fill({ color: 0x1b2a55, alpha: 0.5 });
      if (S.ready[i] > 0.02) {
        const e = 1 - S.ready[i], g = 3 + e * 9;
        dyn.roundRect(rc.x - g, rc.y - g, rc.w + g * 2, rc.h + g * 2, 12 + g).stroke({ width: 2, color: C.bone, alpha: S.ready[i] });
        S.ready[i] = Math.max(0, S.ready[i] - dt * 2.6);
      }
    }

    // Partículas
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.t += dt;
      if (q.t >= q.life) { parts.splice(i, 1); continue; }
      q.vy += 90 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      dyn.circle(q.x, q.y, q.r).fill({ color: q.c, alpha: 1 - q.t / q.life });
    }
  });

  document.body.classList.add('hud-pixi');
  refreshLayout();

  const destroy = () => {
    document.body.classList.remove('hud-pixi');
    danger.remove();
    app.destroy(true, { children: true, texture: true });
  };
  window.HINARIA_HUD_PIXI = { destroy };
  return { destroy };
}

if(window.__pixi){initHudPixiV2().then(r=>{if(!r)document.getElementById("msg").textContent="O Pixi não iniciou (WebGL?).";});}
const A={hit:()=>P.hp=Math.max(1,P.hp-18),heal:()=>P.hp=Math.min(P.max,P.hp+25),mana:()=>P.mana=Math.max(0,P.mana-30),
 xp:()=>{P.xp+=P.lv*20;if(P.xp>=P.lv*50){P.xp-=P.lv*50;P.lv++;}},
 s0:()=>{if(P.cds[0]<=0&&P.mana>=12){P.cds[0]=7;P.mana-=12;}},s1:()=>{if(P.cds[1]<=0&&P.mana>=18){P.cds[1]=11;P.mana-=18;}},s2:()=>{if(P.cds[2]<=0&&P.mana>=23){P.cds[2]=18;P.mana-=23;}}};
document.getElementById("panel").addEventListener("click",e=>{const a=e.target.dataset.a;if(a)A[a]();});
setInterval(()=>{for(let i=0;i<4;i++)P.cds[i]=Math.max(0,P.cds[i]-0.1);P.mana=Math.min(P.mm,P.mana+0.25);},100);
</script></body></html>
