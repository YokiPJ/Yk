<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HINÁRIA · Teste da tela de título (Three.js)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Pixelify+Sans:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e0c16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c16}}
:root[data-theme="dark"]{--bg:#0e0c16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#e8dcc0;font:15px/1.35 "Pixelify Sans",ui-monospace,Menlo,Consolas,monospace}
canvas{display:block}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:10px 10px 8vh;box-sizing:border-box;text-align:center;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#3b3358 0%,#15130f 72%)}
#cover h1{margin:0;font-size:clamp(30px,8vh,58px);letter-spacing:.1em;text-transform:uppercase;color:#e0b93f;text-shadow:0 3px 0 #5a4410,0 6px 18px rgba(0,0,0,.6)}
#cover p{margin:0;opacity:.85;font-size:clamp(13px,2.6vh,17px)}
#cover small{opacity:.55;font-size:11px;max-width:90vw}
#play{font:600 18px "Pixelify Sans",monospace;color:#2a2418;background:#e0b93f;border:2px solid #7a5c0a;padding:10px 34px;cursor:pointer;border-radius:3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(20,16,34,.92);border:1px solid #a78bfa;color:#ebe6f5;padding:8px 14px;border-radius:8px;font:13px system-ui,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* HINÁRIA · Tela de título em Three.js (V1) */
/* HINÁRIA · Tela de título (V2): tipografia RPG em tons de prata/cinza sobre arte P&B */
#title-three{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#cover.t3-on{--ink:#ece9e2;--steel:#c9ccd1;--ash:#9a978f;--dim:#6f6d68;--blood:#b3262d;background:#000;
  font-family:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif}
#cover.t3-on::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 48%,rgba(0,0,0,.92) 100%)}
#cover.t3-on>*:not(#title-three){position:relative;z-index:2}
#cover.t3-on #cv{display:none}

/* Título: letras metálicas, uma a uma */
#cover.t3-on h1{margin-top:auto;display:flex;justify-content:center;flex-wrap:wrap;line-height:1.05;
  font-family:"Cinzel Decorative","Cinzel",Georgia,serif;font-weight:900;text-transform:uppercase;
  font-size:clamp(42px,min(13vw,12vh),100px);letter-spacing:.14em;text-shadow:none;color:var(--ink);
  filter:drop-shadow(0 2px 0 #000) drop-shadow(0 10px 26px rgba(0,0,0,.9))}
#cover.t3-on .t3-ch{display:inline-block;will-change:transform,opacity;padding:0 .02em;
  background:linear-gradient(180deg,#fff 0%,#dfe1e5 36%,#8b8e94 54%,#f1f1f1 72%,#9a9da3 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:t3shine 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*.15s + 2.6s)}
@keyframes t3shine{0%,68%,100%{filter:brightness(1)}80%{filter:brightness(1.9)}}

/* Subtítulo com filetes laterais */
#cover.t3-on p{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,18px);
  font-family:"Cinzel",Georgia,serif;font-weight:500;text-transform:uppercase;letter-spacing:.4em;
  font-size:clamp(10px,min(2.6vw,2.2vh),15px);color:var(--ash);text-shadow:0 2px 10px #000}
#cover.t3-on p::before,#cover.t3-on p::after{content:"";width:clamp(22px,9vw,80px);height:1px;flex:none;
  background:linear-gradient(90deg,transparent,var(--ash))}
#cover.t3-on p::after{transform:scaleX(-1)}

/* Botão */
#cover.t3-on #play{font-family:"Cinzel",Georgia,serif;font-weight:700;text-transform:uppercase;letter-spacing:.42em;
  font-size:clamp(14px,min(4vw,2.4vh),19px);color:var(--ink);background:rgba(0,0,0,.55);border:1px solid var(--steel);
  border-radius:0;padding:.9em 2.4em .9em 2.8em;cursor:pointer;backdrop-filter:blur(3px);
  box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px rgba(201,204,209,.4),0 0 28px rgba(179,38,45,.22);
  transition:color .25s,border-color .25s,box-shadow .25s,background .25s}
#cover.t3-on #play:hover,#cover.t3-on #play:focus-visible{color:#fff;border-color:var(--blood);background:rgba(40,6,8,.6);
  box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px rgba(179,38,45,.75),0 0 34px rgba(179,38,45,.5);outline:none}
#cover.t3-on small{font-family:"Cinzel",Georgia,serif;text-transform:uppercase;letter-spacing:.3em;font-size:10px;color:var(--dim);margin-bottom:auto}

#cover.t3-css>:not(#title-three){animation:t3in .9s ease both}
@keyframes t3in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#cover.t3-css>:not(#title-three){animation:none}#cover.t3-on .t3-ch{animation:none}}

/* Offline (APK): coloque Cinzel*.woff2 em assets/fonts/ e descomente:
@font-face{font-family:"Cinzel";src:url("../fonts/Cinzel-Variable.woff2") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Cinzel Decorative";src:url("../fonts/CinzelDecorative-Black.woff2") format("woff2");font-weight:900;font-display:swap}
*/

</style></head>
<body>
<div id="cover">
  <div id="cv"></div>
  <h1>HINÁRIA</h1>
  <p>Um Mundo Além dos Sonhos</p>
  <button id="play" type="button">Jogar</button>
  <small>HINÁRIA 1.1.0 · teste da tela de título</small>
</div>
<div id="toast"></div>

const HOLD_MS = 4200;   // tempo parado em cada imagem
const FADE_MS = 1700;   // duração do crossfade

const BG_VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const BG_FRAG = `
uniform sampler2D uA; uniform sampler2D uB;
uniform float uAspectA, uAspectB, uAspect, uMix, uTime, uFade, uKbA, uKbB, uGrayA, uGrayB;
uniform vec3 uBgA, uBgB;
uniform vec2 uPointer;
varying vec2 vUv;
vec2 coverUv(vec2 uv,float ia,float sa,float z){ vec2 s=sa>ia?vec2(1.0,ia/sa):vec2(sa/ia,1.0); return (uv-0.5)*s/z+0.5; }
vec2 containUv(vec2 uv,float ia,float sa,float z){ vec2 s=sa>ia?vec2(sa/ia,1.0):vec2(1.0,ia/sa); return (uv-0.5)*s/z+0.5; }
vec3 layer(sampler2D t,float ia,float kb,float gray,vec3 bgc){
  vec2 f=containUv(vUv+uPointer*0.014,ia,uAspect,0.92*(1.0+kb*0.06));
  float m=smoothstep(0.0,0.22,f.x)*smoothstep(1.0,0.78,f.x)*smoothstep(0.0,0.22,f.y)*smoothstep(1.0,0.78,f.y);
  vec3 fg=texture2D(t,clamp(f,0.001,0.999)).rgb;
  fg=mix(fg,vec3(dot(fg,vec3(0.2126,0.7152,0.0722))),gray);
  return mix(bgc,fg,m);
}
void main(){
  vec3 c=mix(layer(uA,uAspectA,uKbA,uGrayA,uBgA),layer(uB,uAspectB,uKbB,uGrayB,uBgB),uMix);
  float g=mix(uGrayA,uGrayB,uMix);
  float v=smoothstep(1.05,0.25,length((vUv-0.5)*vec2(uAspect*0.8,1.0)));
  c*=v;
  c=mix(c,c*vec3(1.06,0.98,1.1),0.5*(1.0-g));
  float grain=fract(sin(dot(vUv*vec2(1731.0,911.0)+uTime,vec2(12.9898,78.233)))*43758.5453);
  c+=(grain-0.5)*0.018;
  gl_FragColor=vec4(c*uFade,1.0);
  #include <colorspace_fragment>
}`;
const P_VERT = `attribute float aSeed; uniform float uTime, uPx; varying float vA;
void main(){
  float t=fract(aSeed*7.0+uTime*(0.018+0.03*fract(aSeed*13.0)));
  vec2 p=vec2(position.x+sin(uTime*0.6+aSeed*20.0)*0.03,-1.1+t*2.2);
  vA=sin(t*3.14159)*(0.35+0.65*fract(aSeed*17.0));
  gl_PointSize=uPx*(2.0+5.0*fract(aSeed*31.0));
  gl_Position=vec4(p,0.0,1.0);
}`;
const P_FRAG = `varying float vA; void main(){
  float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.0,d)*vA;
  gl_FragColor=vec4(vec3(1.0,0.78,0.42)*a,a);
}`;

function webglOk() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch { return false; }
}

/** Divide o título em letras para a animação de entrada. */
function splitTitle(h1) {
  const text = h1.textContent || '';
  h1.setAttribute('aria-label', text);
  h1.textContent = '';
  const letters = [];
  let i = 0;
  for (const ch of text) {
    const s = document.createElement('span');
    s.style.setProperty('--i', i++);
    s.className = 't3-ch'; s.setAttribute('aria-hidden', 'true');
    s.textContent = ch === ' ' ? '\u00a0' : ch;
    h1.append(s); letters.push(s);
  }
  return letters;
}

async function initTitleScreenThree() {
  const cover = document.getElementById('cover');
  if (!cover || cover.dataset.t3 || !webglOk()) return null;
  cover.dataset.t3 = '1';

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches;

  // ---------- Three.js ----------
  const canvas = document.createElement('canvas');
  canvas.id = 'title-three';
  canvas.setAttribute('aria-hidden', 'true');
  cover.prepend(canvas);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'low-power' });
  } catch (e) { canvas.remove(); delete cover.dataset.t3; return null; }
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, touch ? 1.5 : 2));

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const loader = new THREE.TextureLoader();
  const slots = []; // {tex, aspect}
  const loadTex = def => new Promise(resolve => loader.load(def.src, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    resolve({ tex: t, aspect: t.image.width / t.image.height, gray: def.gray ? 1 : 0, bg: new THREE.Color(def.bg) });
  }, undefined, () => resolve(null)));

  const first = await loadTex(IMAGES[0]);
  if (!first) { renderer.dispose(); canvas.remove(); delete cover.dataset.t3; return null; }
  slots.push(first);

  const u = {
    uA: { value: first.tex }, uB: { value: first.tex },
    uAspectA: { value: first.aspect }, uAspectB: { value: first.aspect },
    uGrayA: { value: first.gray }, uGrayB: { value: first.gray },
    uBgA: { value: first.bg }, uBgB: { value: first.bg },
    uAspect: { value: 1 }, uMix: { value: 0 }, uTime: { value: 0 }, uFade: { value: 0 },
    uKbA: { value: 0 }, uKbB: { value: 0 }, uPointer: { value: new THREE.Vector2() }
  };
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2),
    new THREE.ShaderMaterial({ uniforms: u, vertexShader: BG_VERT, fragmentShader: BG_FRAG, depthTest: false, depthWrite: false }));
  scene.add(quad);

  const N = touch ? 28 : 56;
  const pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = Math.random() * 2 - 1; seed[i] = Math.random(); }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pg.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const pu = { uTime: u.uTime, uPx: { value: renderer.getPixelRatio() } };
  const points = new THREE.Points(pg, new THREE.ShaderMaterial({
    uniforms: pu, vertexShader: P_VERT, fragmentShader: P_FRAG,
    transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  points.frustumCulled = false;
  scene.add(points);

  const resize = () => {
    const w = Math.max(1, cover.clientWidth), h = Math.max(1, cover.clientHeight);
    renderer.setSize(w, h, false);
    u.uAspect.value = w / h;
  };
  const ro = new ResizeObserver(resize); ro.observe(cover); resize();

  // Parallax suave pelo ponteiro (suavizado)
  const target = new THREE.Vector2();
  const onMove = e => {
    const r = cover.getBoundingClientRect();
    target.set(((e.clientX - r.left) / r.width - 0.5) * 2, -((e.clientY - r.top) / r.height - 0.5) * 2);
  };
  if (!reduce) cover.addEventListener('pointermove', onMove, { passive: true });

  // ---------- Controle de imagens (crossfade) ----------
  let cur = 0, busy = false;
  const state = { mix: 0, fade: 0 };
  let anime = null;
  anime = window.anime || null;

  const tween = (obj, props, duration, done) => {
    if (anime) { anime({ targets: obj, ...props, duration, easing: 'easeInOutSine', update: sync, complete: done }); return; }
    const keys = Object.keys(props), from = keys.map(k => obj[k]), t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / duration), e = 0.5 - Math.cos(Math.PI * k) / 2;
      keys.forEach((key, i) => { obj[key] = from[i] + (props[key] - from[i]) * e; });
      sync();
      if (k < 1 && running) requestAnimationFrame(step); else if (k >= 1 && done) done();
    };
    requestAnimationFrame(step);
  };
  const sync = () => { u.uMix.value = state.mix; u.uFade.value = state.fade; };

  const preload = async () => { // carrega o resto em segundo plano
    for (let i = 1; i < IMAGES.length; i++) { const s = await loadTex(IMAGES[i]); if (s) slots.push(s); }
  };
  const next = () => {
    if (busy || slots.length < 2 || !running) return;
    busy = true;
    const nxt = (cur + 1) % slots.length;
    u.uB.value = slots[nxt].tex; u.uAspectB.value = slots[nxt].aspect;
    u.uGrayB.value = slots[nxt].gray; u.uBgB.value = slots[nxt].bg;
    state.mix = 0; sync();
    tween(state, { mix: 1 }, reduce ? 500 : FADE_MS, () => {
      u.uA.value = slots[nxt].tex; u.uAspectA.value = slots[nxt].aspect;
      u.uGrayA.value = slots[nxt].gray; u.uBgA.value = slots[nxt].bg;
      state.mix = 0; sync(); cur = nxt; busy = false;
    });
  };

  // ---------- Loop ----------
  let running = true, raf = 0, last = performance.now(), nextAt = performance.now() + HOLD_MS + 800;
  const frame = now => {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    u.uTime.value += dt;
    u.uPointer.value.lerp(target, 1 - Math.exp(-dt * 3));
    const kb = reduce ? 0 : (Math.sin(u.uTime.value * 0.12) * 0.5 + 0.5);
    u.uKbA.value = kb; u.uKbB.value = 1 - kb;
    if (now >= nextAt) { next(); nextAt = now + HOLD_MS + FADE_MS; }
    renderer.render(scene, camera);
  };
  raf = requestAnimationFrame(frame);

  const dispose = () => {
    if (!running) return;
    running = false; cancelAnimationFrame(raf); ro.disconnect();
    cover.removeEventListener('pointermove', onMove);
    slots.forEach(s => s.tex.dispose()); pg.dispose(); quad.geometry.dispose();
    quad.material.dispose(); points.material.dispose(); renderer.dispose(); canvas.remove();
  };
  // Descarta quando o #cover some (clique já aplica .out e remove em 600 ms)
  new MutationObserver((_, ob) => { if (!cover.isConnected || cover.classList.contains('out')) { ob.disconnect(); setTimeout(dispose, 650); } })
    .observe(cover, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver((_, ob) => { if (!cover.isConnected) { ob.disconnect(); dispose(); } })
    .observe(document.body, { childList: true });

  // ---------- Entrada da interface ----------
  cover.classList.add('t3-on');
  const h1 = cover.querySelector('h1');
  const letters = h1 ? splitTitle(h1) : [];
  const rest = [...cover.querySelectorAll('p, #play, small')];
  if (reduce) { state.fade = 1; sync(); }
  else if (anime) {
    const base = new Map(rest.map(el => [el, parseFloat(getComputedStyle(el).opacity) || 1]));
    anime.set(letters, { opacity: 0, translateY: 26 });
    anime.set(rest, { opacity: 0, translateY: 14 });
    anime({ targets: state, fade: 1, duration: 1400, easing: 'easeOutQuad', update: sync });
    const tl = anime.timeline({ easing: 'easeOutExpo' });
    tl.add({ targets: letters, opacity: 1, translateY: 0, duration: 900, delay: anime.stagger(70, { start: 500 }) })
      .add({ targets: rest, opacity: el => [0, base.get(el)], translateY: [14, 0], duration: 700, delay: anime.stagger(140) }, '-=400');
    const play = cover.querySelector('#play');
    if (play) tl.finished.then(() => anime({
      targets: play, scale: [1, 1.045], direction: 'alternate', loop: true, duration: 1100, easing: 'easeInOutSine'
    }));
  } else {
    tween(state, { fade: 1 }, 1400);
    cover.classList.add('t3-css');
  }
  preload();
  return { dispose };
}

initTitleScreenThree().then(r=>{if(!r){toast.textContent="WebGL indisponível: usando a capa CSS original.";toast.classList.add("on");}}).catch(e=>{console.warn(e);toast.textContent="Erro ao iniciar o Three.js: "+e.message;toast.classList.add("on");});
</script>
