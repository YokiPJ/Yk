<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HINÁRIA VFX Studio</title>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;height:100%;background:#0d1018;color:#f4e8cb;font:13px system-ui,sans-serif;overflow:hidden}#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:absolute;left:0;top:0;bottom:0;width:min(210px,42vw);overflow:auto;background:#161b26e8;border-right:2px solid #c19b5b;padding:8px;box-sizing:border-box}
h3{margin:0 0 6px;color:#edc37e;font-size:15px}h4{margin:10px 0 4px;color:#9fb4e0;font-size:12px;text-transform:uppercase;letter-spacing:1px}
button{display:block;width:100%;margin:3px 0;padding:8px;border-radius:8px;border:1px solid #5d4830;background:#2a2f3c;color:#f4e8cb;font-size:13px;text-align:left;touch-action:manipulation}button:active,button.on{background:#5d4830;border-color:#edc37e}
.row{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:12px}input[type=range]{flex:1}#stats{position:absolute;right:8px;top:8px;background:#0009;padding:4px 8px;border-radius:6px;font-size:11px;max-width:60vw;text-align:right}
#tip{position:absolute;right:8px;bottom:8px;background:#0009;padding:4px 8px;border-radius:6px;font-size:11px;text-align:right}</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><h3>VFX Studio</h3>
<div class="row"><span>Tamanho</span><input id="scale" type="range" min="0.5" max="2.5" step="0.1" value="1"><span id="sv">1.0×</span></div>
<div class="row"><input id="usecolor" type="checkbox"><span>Cor</span><input id="color" type="color" value="#ff8a3a"></div>
<button id="auto">▶ Tocar todos (auto)</button><button id="clear">✖ Limpar</button><button id="shot">📷 Captura PNG</button><div id="list"></div></div>
<div id="stats"></div><div id="tip">Toque no chão: move o alvo · ← → troca efeito · arraste: gira a câmera</div>
<script type="module" src="./src/studio.js"></script></body></html>
